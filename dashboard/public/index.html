<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Data Refresh Control Panel</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Data Refresh Control Panel</h1>
        <p>Winnipeg + Manitoba local data maintenance</p>
      </div>
      <div class="topbar-right">
        <span id="active-pill" class="active-pill">idle</span>
        <span id="now" class="now"></span>
      </div>
    </header>

    <main class="shell">
      <section class="card">
        <div class="section-head">
          <h2>Overview</h2>
          <button id="btn-refresh" class="ghost" type="button">Refresh Status</button>
        </div>
        <div id="roots" class="roots"></div>
        <div id="git-status" class="git-grid"></div>
      </section>

      <section class="section-head standalone">
        <h2>Refresh Jobs</h2>
        <p>Each button runs a fixed local script chain and streams the logs below.</p>
      </section>
      <section id="items" class="items"></section>

      <section class="card progress-card">
        <div class="section-head">
          <h2>Live Progress</h2>
          <div class="progress-controls">
            <label><input type="checkbox" id="autoscroll" checked /> Auto-scroll</label>
            <button id="btn-cancel" type="button" class="danger" disabled>Cancel</button>
            <button id="btn-clear" type="button" class="ghost">Clear Log</button>
          </div>
        </div>
        <pre id="log" class="log"></pre>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
