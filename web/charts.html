<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sales Charts — Manitoba Parcel Search</title>
  </head>
  <body class="charts-body">
    <header class="charts-header">
      <div class="charts-headline">
        <h1>Sales Charts</h1>
        <!-- Live/frozen state. The tab tracks the Sales Analysis filters
             in the main window over a BroadcastChannel; freezing stops it
             so a chart can be read (or screenshotted) while the filters
             keep moving next door. -->
        <p id="charts-status" class="charts-status">Waiting for the Sales Analysis tab…</p>
      </div>

      <!-- One filter row, above everything it scopes. Every chart and the
           table below re-render against the same slice, so the numbers
           always agree. -->
      <div class="charts-controls" role="group" aria-label="Chart options">
        <div class="ctl" id="ctl-unit">
          <span class="ctl-label" id="unit-label">Size unit</span>
          <div class="segmented" role="radiogroup" aria-labelledby="unit-label">
            <button type="button" id="unit-acres" role="radio" aria-checked="true">Acres</button>
            <button type="button" id="unit-sf" role="radio" aria-checked="false">Sq ft</button>
          </div>
        </div>

        <!-- Two separate questions, deliberately not one control:
             WHETHER the by-size and by-distance charts plot adjusted
             rates, and on WHAT BASIS the adjustment (and the over-time
             trend line) is computed. The over-time charts ignore the
             first and follow only the second. -->
        <div class="ctl">
          <span class="ctl-label" id="rates-label">Rates</span>
          <div class="segmented" role="radiogroup" aria-labelledby="rates-label">
            <button type="button" id="rates-nominal" role="radio" aria-checked="false">Nominal</button>
            <button type="button" id="rates-adjusted" role="radio" aria-checked="true">Time-adjusted</button>
          </div>
          <span class="ctl-hint" id="rates-hint">Applies to the by-size and by-distance charts.</span>
        </div>

        <div class="ctl">
          <label class="ctl-label" for="adj-basis">Trend basis</label>
          <div class="ctl-pair">
            <select id="adj-basis">
              <option value="fitted">Fitted trend</option>
              <option value="override">Rate per year…</option>
            </select>
            <input type="number" id="adj-rate" step="0.5" aria-label="Annual adjustment rate, percent" hidden />
          </div>
          <span class="ctl-hint" id="adj-hint"></span>
        </div>

        <div class="ctl">
          <label class="ctl-label" for="eff-date">Effective date</label>
          <input type="date" id="eff-date" />
          <span class="ctl-hint">Comps are carried to this date.</span>
        </div>

        <div class="ctl">
          <label class="ctl-label" for="dist-ref">Distance from</label>
          <select id="dist-ref">
            <option value="subject">Subject parcel</option>
            <option value="winnipeg">Winnipeg (Portage &amp; Main)</option>
          </select>
        </div>

        <div class="ctl ctl-checks">
          <label class="ctl-check">
            <input type="checkbox" id="freeze" />
            <span>Freeze</span>
          </label>
          <label class="ctl-check">
            <input type="checkbox" id="show-table" />
            <span>Table view</span>
          </label>
        </div>
      </div>
    </header>

    <main>
      <p id="charts-empty" class="charts-empty">
        No sales loaded yet. In the main window, open <strong>Sales Analysis</strong>,
        import or paste a sales export, then click <strong>Charts</strong> again.
      </p>

      <!-- Two chart sets over one filtered slice. The tabs are named for
           the MEASURE each puts on the y-axis, not for a property type:
           neither filters the records, so calling one "Residential" would
           promise a narrowing it does not do. Total price is the view for
           land-and-building sales, where a rate per acre divides a price
           that is mostly building by land the building sits on. -->
      <div class="charts-tabs" role="tablist" aria-label="Chart set">
        <button type="button" id="tab-rates" role="tab" aria-selected="true"
                aria-controls="charts-grid"
                title="Price per acre, per square foot and per lot — the land-rate views.">Land rates</button>
        <button type="button" id="tab-total" role="tab" aria-selected="false"
                aria-controls="charts-grid"
                title="The whole consideration, undivided. For land-and-building sales, where a per-acre rate spreads building value across land.">Total price</button>
      </div>

      <div id="charts-grid" class="charts-grid" hidden></div>

      <!-- Table-view twin. Every value the charts encode is reachable here
           without hovering anything, which is also what carries the two
           lighter palette slots past the contrast floor. -->
      <section id="table-panel" class="table-panel" hidden>
        <h2>Sales in the current filter</h2>
        <div class="table-scroll">
          <table id="sales-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module" src="/src/charts/main.js"></script>
  </body>
</html>
